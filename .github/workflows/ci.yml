name: Native CI Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux release is pinned rather than following ubuntu-latest, so
        # that Dockerfile builds the same toolchain ci-local.sh runs.  Change
        # both together.
        os: [ ubuntu-24.04, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Install ponyup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/ponylang/ponyup/latest-release/ponyup-init.sh | sh
          echo "$HOME/.local/share/ponyup/bin" >> "$GITHUB_PATH"

      - name: Install ponyc
        run: |
          ponyup update ponyc release
          ponyc --version

      - name: Show tool versions
        run: |
          cmake --version
          erl -noshell -eval 'io:format("OTP ~s, erl_interface ~s~n", [erlang:system_info(otp_release), code:lib_dir(erl_interface)]), halt().'

      - name: Build
        run: ./build.sh

      - name: Unit tests
        run: ./test.sh

      - name: Integration test against a live Elixir node
        run: ./integration.sh
