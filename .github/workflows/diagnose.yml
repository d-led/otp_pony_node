name: Diagnose a stalled suite

# Temporary: the unit tests hang on a hosted Linux runner.  This runs them with
# a watchdog and prints what each thread is waiting on, plus the host's name
# resolution, which is what the erl_interface node setup touches first.

on:
  workflow_dispatch:

jobs:
  probe:
    name: where the suite waits
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Install ponyup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/ponylang/ponyup/latest-release/ponyup-init.sh | sh
          echo "$HOME/.local/share/ponyup/bin" >> "$GITHUB_PATH"

      - name: Install ponyc
        run: |
          ponyup update ponyc release
          ponyc --version

      - name: Build
        run: ./build.sh

      - name: What this host is called
        run: |
          hostname
          hostname -f || true
          getent hosts "$(hostname)" || echo 'the host name is not in the hosts file'
          echo '--- /etc/hosts ---'
          cat /etc/hosts
          echo '--- /etc/nsswitch.conf ---'
          grep '^hosts' /etc/nsswitch.conf || true
          echo '--- epmd ---'
          command -v epmd || true
          epmd -names || true

      - name: What publishing and accepting look like here
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/main.pony <<'PONY'
          use "erl_interface_pony"

          actor _Caller
            let _target: String
            let _env: Env

            new create(target: String, env: Env) =>
              _target = target
              _env = env

            be call() =>
              let node = EInterface("probe_caller", "cookie")
              node.set_tracelevel(3)

              match node.connect_with_timeout(_target, 10_000)
              | ConnectionSucceeded => _env.out.print("caller: connected")
              | ConnectionFailed =>
                _env.out.print("caller: failed (" + node.last_error() + ")")
              end

          actor _Server
            let _env: Env

            new create(env: Env) =>
              _env = env

            be serve() =>
              let node = EInterface("probe_server", "cookie")
              node.set_tracelevel(3)

              match node.publish(0)
              | Published =>
                _env.out.print("server: " + node.this_nodename() + " on port "
                  + node.published_port().string())
              | PublishFailed =>
                _env.out.print("server: cannot publish ("
                  + node.last_error() + ")")
                return
              end

              _Caller(node.this_nodename(), _env).call()

              match node.accept_with_timeout(10_000)
              | let connection: EInterface =>
                _env.out.print("server: accepted " + connection.peer_nodename())
                connection.dispose()
              | AcceptTimedOut => _env.out.print("server: nobody called")
              | AcceptFailed =>
                _env.out.print("server: accepting failed ("
                  + node.last_error() + ")")
              end

              node.dispose()

          actor Main
            new create(env: Env) =>
              _Server(env).serve()
          PONY
          cd /tmp/probe
          ponyc -p "$GITHUB_WORKSPACE" -b probe 2>&1 | tail -5
          epmd -daemon || true
          timeout 40 ./probe 2>&1 | head -60
          echo '--- epmd, after ---'
          epmd -names || true

      - name: Run the tests with a watchdog
        timeout-minutes: 30
        run: |
          set -uo pipefail

          for attempt in 1 2 3 4 5; do
            echo "=== attempt $attempt ==="
            ./test.sh > "/tmp/tests.$attempt.log" 2>&1 &
            runner=$!

            for _ in $(seq 1 30); do
              if ! kill -0 "$runner" 2>/dev/null; then
                break
              fi
              sleep 2
            done

            if kill -0 "$runner" 2>/dev/null; then
              echo '=== stalled: the tests so far ==='
              tail -20 "/tmp/tests.$attempt.log"

              pid=$(pgrep -n -f otp_pony_node_test)
              echo "=== process $pid, one line per thread ==="
              ps -L -o pid,tid,stat,wchan:38,comm -p "$pid" || true

              echo '=== the kernel call each thread sits in ==='
              for task in /proc/"$pid"/task/*; do
                printf '%s %s\n' "$(basename "$task")" "$(cat "$task/wchan" 2>/dev/null)"
              done

              echo '=== epmd ==='
              epmd -names || true
              ss -ltnp | head -20 || true

              echo '=== C stacks ==='
              sudo apt-get install -y gdb >/dev/null 2>&1 || true
              sudo timeout 120 gdb -q -batch -p "$pid" -ex 'thread apply all bt' 2>&1 | tail -120

              kill -9 "$pid" || true
              exit 1
            fi

            wait "$runner" || true
            grep -E 'tests ran|Passed:|FAILED' "/tmp/tests.$attempt.log" | tail -3
            if grep -q FAILED "/tmp/tests.$attempt.log"; then
              cat "/tmp/tests.$attempt.log"
            fi
          done
